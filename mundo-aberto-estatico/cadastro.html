<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://images.unsplash.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://fyubhfcffvukzlsvrqpk.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="referrer" content="no-referrer">
    <title>
      Cadastro — Mundo Aberto
    </title>
    <link rel="stylesheet" href="static/css/style.css">
  </head>
  <body>
    <header class="navbar">
      <a class="logo" href="index.html">
        <span class="logo-icon">
          ✦
        </span>
        mundo
        <span>
          aberto
        </span>
      </a>
      <nav>
        <a href="index.html">
          Início
        </a>
        <a href="destinos.html">
          Explorar destinos
        </a>
      </nav>
    </header>
    <main>
      <section class="auth-layout">
        <div class="auth-photo">
          <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=85" alt="Paisagem de viagem">
          <div>
            <p class="eyebrow">
              MUNDO ABERTO
            </p>
            <h2>
              O próximo capítulo
              <br>
              é seu.
            </h2>
          </div>
        </div>
        <div class="auth-panel">
          <p class="eyebrow dark">CONTA DE VIAJANTE</p>
          <h1>Crie sua conta</h1>
          <p class="auth-subtitle">Comece a planejar suas próximas viagens.</p>
          <form id="register-form">
            <label for="name">Nome completo</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Seu nome"
              autocomplete="name"
              required
            >
            <label for="email">E-mail</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="seuemail@exemplo.com"
              autocomplete="email"
              required
            >
            <label for="password">Senha</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Mínimo de 6 caracteres"
              minlength="6"
              autocomplete="new-password"
              required
            >
            <label for="confirm-password">Confirmar senha</label>
            <input
              type="password"
              id="confirm-password"
              name="confirm-password"
              placeholder="Digite a senha novamente"
              minlength="6"
              autocomplete="new-password"
              required
            >
            <p id="register-message" role="status"></p>
            <button type="submit" class="btn-dark">
              Criar minha conta
            </button>
          </form>
          <button type="button" id="google-btn" class="btn-dark">
            Continuar com o Google
          </button>
          <p class="auth-subtitle">Já possui uma conta? <a href="login.html">Entrar</a></p>
        </div>
      </section>
    </main>
    <!-- Ordem importa: CDN → supabase.js → auth.js → main.js -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="static/js/supabase.js"></script>
    <script src="static/js/auth.js"></script>
    <script src="static/js/main.js"></script>
  </body>
</html>
